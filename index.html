<style>
  :root{
    --bg:#f3efe4; --bg-elev:#ffffff; --card:#fbf8f0; --ink:#20201c; --ink-dim:#6b6558;
    --accent:#b9791f; --accent-ink:#fffaf0; --danger:#a13d33; --crew:#2b6a8a; --line:#ddd3bd;
    --shadow:0 1px 0 rgba(0,0,0,.06); --radius:16px;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101018; --bg-elev:#191a24; --card:#1e1f2b; --ink:#f1eee2; --ink-dim:#9b98ab;
      --accent:#e8b23d; --accent-ink:#1c1408; --danger:#e07a6f; --crew:#79c1e6; --line:#31324a;
      --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#101018; --bg-elev:#191a24; --card:#1e1f2b; --ink:#f1eee2; --ink-dim:#9b98ab;
    --accent:#e8b23d; --accent-ink:#1c1408; --danger:#e07a6f; --crew:#79c1e6; --line:#31324a;
    --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme: dark;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; padding-top:var(--safe-t); padding-bottom:var(--safe-b);
    min-height:100%; overscroll-behavior:none; touch-action:none;
  }
  h1,h2,h3,.display{ font-family:'Special Elite','Inter',monospace; letter-spacing:.01em; }
  #app{ max-width:560px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }
  #app.narrow{ padding:20px 18px 40px; }
  .topbar{ display:flex; align-items:baseline; justify-content:space-between; padding:12px 18px 14px; border-bottom:1px dashed var(--line); }
  .topbar h1{ font-size:1.3rem; margin:0; }
  .topbar .tag{ font-size:.7rem; color:var(--ink-dim); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:var(--shadow); }
  .muted{ color:var(--ink-dim); }
  .center{ text-align:center; }
  p{ line-height:1.5; }
  input[type=text]{ width:100%; font-size:1rem; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg-elev); color:var(--ink); font-family:inherit; }
  input[type=text]:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  button{ font-family:'Inter',sans-serif; font-size:.98rem; cursor:pointer; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px 16px; border-radius:12px; border:1px solid transparent; font-weight:700; transition:transform .08s ease; }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-secondary{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .stepper{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 2px; }
  .stepper button{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg-elev); color:var(--ink); font-size:1.1rem; font-weight:700; }
  .stepper .val{ font-weight:700; min-width:70px; text-align:center; }
  .btn-row{ display:flex; gap:10px; width:auto; }
  .row{ display:flex; align-items:center; justify-content:space-between; margin:10px 0; }
  .players{ display:flex; flex-direction:column; gap:8px; }
  .player{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:var(--bg-elev); border:1px solid var(--line); }
  .avatar{ width:36px; height:36px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.9rem; border:1px solid var(--line); color:#fff; }
  .pname{ font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge{ font-size:.68rem; padding:3px 8px; border-radius:20px; border:1px solid var(--line); color:var(--ink-dim); }
  .badge.host{ color:var(--accent); border-color:var(--accent); }
  .reveal-card{ border-radius:20px; padding:36px 20px; text-align:center; cursor:pointer; background:var(--bg-elev); border:1px dashed var(--line); user-select:none; }
  .reveal-card .hint{ color:var(--ink-dim); font-size:.85rem; margin-top:10px; }
  .word-big{ font-family:'Special Elite',monospace; font-size:1.9rem; margin:6px 0; }
  .impostor-flag{ color:var(--danger); }
  .timer{ font-family:'Special Elite',monospace; font-size:2.4rem; text-align:center; margin:4px 0; }
  .vote-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .vote-tile{ border-radius:14px; padding:14px 10px; text-align:center; background:var(--bg-elev); border:2px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:6px; }
  .vote-tile.selected{ border-color:var(--accent); }
  .vote-tile .vname{ font-weight:600; font-size:.85rem; word-break:break-word; }
  .footer-note{ text-align:center; color:var(--ink-dim); font-size:.76rem; margin-top:16px; line-height:1.5; }
  .empty{ text-align:center; padding:30px 10px; color:var(--ink-dim); }
  .spin{ width:26px; height:26px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:spin 1s linear infinite; margin:0 auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---- Game view ---- */
  .gamewrap{ position:relative; flex:1; display:flex; flex-direction:column; min-height:0; }
  .hud-top{ display:flex; align-items:center; justify-content:space-between; padding:8px 14px; gap:10px; background:var(--bg-elev); border-bottom:1px solid var(--line); font-size:.8rem; }
  .hud-top .tasks-progress{ font-weight:700; }
  #mapCanvas{ display:block; width:100%; touch-action:none; background:#0c0d13; }
  .canvas-holder{ position:relative; flex:1; min-height:0; overflow:hidden; }
  .joy-base{ position:absolute; left:18px; bottom:calc(18px + var(--safe-b)); width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.25); touch-action:none; }
  .joy-knob{ position:absolute; left:35px; top:35px; width:40px; height:40px; border-radius:50%; background:rgba(232,178,61,.85); pointer-events:none; }
  .hud-actions{ position:absolute; right:14px; bottom:calc(18px + var(--safe-b)); display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .action-btn{ padding:12px 18px; border-radius:30px; font-weight:800; border:none; box-shadow:0 2px 8px rgba(0,0,0,.35); }
  .action-btn.task{ background:var(--accent); color:var(--accent-ink); }
  .action-btn.kill{ background:var(--danger); color:#fff; }
  .action-btn.report{ background:#d94f9c; color:#fff; }
  .action-btn.meeting{ background:#4c7a3d; color:#fff; }
  .task-panel{ position:absolute; top:8px; left:8px; background:rgba(15,16,22,.85); color:#f1eee2; border-radius:12px; padding:8px 10px; font-size:.72rem; max-width:150px; }
  .task-panel div{ padding:2px 0; }
  .task-panel .done{ text-decoration:line-through; opacity:.5; }

  /* ---- Minigame modal ---- */
  .modal{ position:fixed; inset:0; background:rgba(5,5,8,.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-card{ background:var(--card); border-radius:20px; padding:22px; width:100%; max-width:340px; border:1px solid var(--line); }
  .wire-row{ display:flex; justify-content:space-between; align-items:center; margin:26px 0; }
  .wire-dot{ width:34px; height:34px; border-radius:50%; border:3px solid transparent; cursor:pointer; }
  .wire-dot.selected{ border-color:var(--ink); }
  .wire-dot.locked{ opacity:.35; cursor:default; }
  .pattern-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0; }
  .pattern-btn{ height:80px; border-radius:16px; border:2px solid var(--line); opacity:.55; transition:opacity .15s; }
  .pattern-btn.lit{ opacity:1; box-shadow:0 0 0 3px rgba(255,255,255,.5) inset; }

  @media (prefers-reduced-motion: reduce){ .btn{ transition:none; } .spin{ animation:none; } .pattern-btn{ transition:none; } }
</style>

<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyDPcCaTSJKix9JHmWWWlCGrBdrAePPSJCk",
    authDomain: "impostor-45469.firebaseapp.com",
    databaseURL: "https://impostor-45469-default-rtdb.firebaseio.com",
    projectId: "impostor-45469",
    storageBucket: "impostor-45469.firebasestorage.app",
    messagingSenderId: "305666372514",
    appId: "1:305666372514:web:ef48c426b903ff83b2f8fb"
  };
  var NEEDS_SETUP = (firebaseConfig.apiKey === "TU_API_KEY");

  // ---------- Map data ----------
  var MAP_W = 900, MAP_H = 620;
  var ROOMS = [
    { id:'reactor', name:'Reactor', x:20, y:20, w:200, h:170, color:'#2b4d66', task:'pattern' },
    { id:'electrico', name:'Eléctrico', x:250, y:20, w:170, h:150, color:'#4a3466', task:'wire' },
    { id:'navegacion', name:'Navegación', x:700, y:20, w:180, h:150, color:'#33552c', task:'wire' },
    { id:'admin', name:'Admin', x:360, y:240, w:180, h:150, color:'#245050', task:'pattern' },
    { id:'comunicaciones', name:'Comunicaciones', x:700, y:450, w:180, h:150, color:'#6e2a2a', task:'pattern' },
    { id:'almacen', name:'Almacén', x:20, y:450, w:200, h:150, color:'#7a4a1e', task:'wire' }
  ];
  function roomCenter(r){ return { x:r.x + r.w/2, y:r.y + r.h/2 }; }
  function findRoom(id){ for (var i=0;i<ROOMS.length;i++) if (ROOMS[i].id===id) return ROOMS[i]; return null; }
  var SPAWN = { x: 450, y: 310 };
  var TASK_RANGE = 55, KILL_RANGE = 60, REPORT_RANGE = 70, SPEED = 155, KILL_COOLDOWN_MS = 20000;
  var TASKS_PER_PLAYER = 3;
  var WIRE_COLORS = ['#d64545','#4aa3d6','#e0b23d','#4caf6a'];
  var PATTERN_COLORS = ['#d64545','#4aa3d6','#e0b23d','#4caf6a'];

  // ---------- PRNG ----------
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, seed){
    var rnd = mulberry32(seed), a = arr.slice();
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function computeImpostorIds(order, seed, count){
    return seededShuffle(order, seed).slice(0, Math.max(1, Math.min(count, order.length - 1)));
  }
  function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2, y1-y2); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  var AVATAR_PALETTE = ["#b9791f","#2b6a8a","#a13d33","#4c7a3d","#7a4c9d","#c26b2f","#2f6e6e","#8a5a2b","#d94f9c","#4a7fd6"];
  function colorForId(id){ var h=0; for (var i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0; return AVATAR_PALETTE[h % AVATAR_PALETTE.length]; }

  // ---------- App state ----------
  var rtdb=null, auth=null, stateRef=null, playersRef=null;
  var myId=null, myName="", myColor="#b9791f";
  var gameState=undefined, players=[];
  var connError=null;
  var localRevealed=false, localRevealRound=null;
  var mountedPhase = null;
  var app = document.getElementById('app');

  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined&&text!==null) e.textContent=text; return e; }
  function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
  function isHost(){ return gameState && gameState.hostId===myId; }
  function alivePlayers(){ return players.filter(function(p){ return p.alive!==false; }); }
  function findPlayer(id){ for (var i=0;i<players.length;i++) if (players[i].id===id) return players[i]; return null; }
  function avatarEl(p){ var d=document.createElement('div'); d.className='avatar'; d.style.background=p.color||'#b9791f'; d.textContent=((p.name||'?').trim().charAt(0)||'?').toUpperCase(); return d; }

  function loadGuestName(){ try{ return localStorage.getItem('impostor_guest_name')||''; }catch(e){ return ''; } }
  function saveGuestName(n){ try{ localStorage.setItem('impostor_guest_name', n); }catch(e){} }

  function initFirebase(){
    if (NEEDS_SETUP){ connError='needs-setup'; render(); return false; }
    try{ firebase.initializeApp(firebaseConfig); rtdb=firebase.database(); auth=firebase.auth(); }
    catch(e){ connError='init-failed'; render(); return false; }
    stateRef = rtdb.ref('games/default/state');
    playersRef = rtdb.ref('games/default/players');
    return true;
  }
  function initIdentity(){
    return new Promise(function(resolve){
      auth.onAuthStateChanged(function(user){
        if (user){ myId=user.uid; myColor=colorForId(myId); myName=loadGuestName(); resolve(); }
        else { auth.signInAnonymously().catch(function(){ connError='auth-failed'; render(); resolve(); }); }
      });
    });
  }
  function subscribe(){
    stateRef.on('value', function(snap){ gameState = snap.exists()? snap.val() : null; render(); }, function(){ connError='db-error'; render(); });
    playersRef.on('value', function(snap){
      var val = snap.val() || {};
      players = Object.keys(val).map(function(id){ var d=val[id]; d.id=id; return d; });
      render();
    }, function(){ connError='db-error'; render(); });
  }

  // ---------- Actions ----------
  function ensureGameDocExists(){
    return stateRef.once('value').then(function(snap){
      if (!snap.exists()) return stateRef.set({ phase:'lobby', hostId:myId, createdAt:new Date().toISOString() }).catch(function(){});
    });
  }
  function joinLobby(){
    var data = { name:myName||'Jugador', color:myColor, joinedAt:new Date().toISOString(), alive:true, voteFor:null, ready:false, x:SPAWN.x, y:SPAWN.y, meetingsUsed:0 };
    return playersRef.child(myId).set(data).then(ensureGameDocExists);
  }
  function leaveLobby(){ return playersRef.child(myId).remove().catch(function(){}); }
  function becomeHost(){ return stateRef.update({ hostId:myId }).catch(function(){}); }

  function impostorSuggestion(n){ return Math.max(1, Math.min(3, Math.floor(n/5) || 1)); }
  var pendingSettings = { impostorCount:null, discussionSeconds:60 };

  function assignTasksFor(order){
    var roomIds = ROOMS.map(function(r){ return r.id; });
    var assign = {};
    order.forEach(function(id, idx){
      var shuffled = seededShuffle(roomIds, Math.floor(Math.random()*1e9) + idx);
      assign[id] = shuffled.slice(0, Math.min(TASKS_PER_PLAYER, roomIds.length));
    });
    return assign;
  }

  function startGame(){
    var order = players.map(function(p){ return p.id; });
    if (order.length < 3) return;
    var seed = Math.floor(Math.random()*1e9);
    var impostorCount = pendingSettings.impostorCount || impostorSuggestion(order.length);
    impostorCount = Math.max(1, Math.min(impostorCount, order.length-2>0 ? order.length-2 : 1));
    var impostorIds = computeImpostorIds(order, seed, impostorCount);
    var assign = assignTasksFor(order);

    var writes = players.map(function(p){
      return playersRef.child(p.id).update({
        alive:true, voteFor:null, ready:false, x:SPAWN.x + (Math.random()*40-20), y:SPAWN.y + (Math.random()*40-20),
        tasksAssigned: assign[p.id], tasksDone: [], lastKillAt: 0, meetingsUsed: 0, deathX:null, deathY:null, bodyReported:true
      });
    });
    return Promise.all(writes).then(function(){
      return stateRef.update({
        phase:'reveal', seed:seed, order:order, impostorCount:impostorCount,
        discussionSeconds: pendingSettings.discussionSeconds || 60,
        discussionEndsAt:null, round:1, lastEliminatedId:null, lastEliminatedRole:null, winner:null,
        meetingCallerId:null, meetingReason:null,
        startedAt:new Date().toISOString()
      });
    });
  }
  function markReady(){ return playersRef.child(myId).update({ ready:true }); }
  function beginPlaying(){ return stateRef.update({ phase:'playing' }); }

  function updateMyPosition(x,y){ return playersRef.child(myId).update({ x:x, y:y }); }

  function completeTask(roomId){
    var me = findPlayer(myId);
    if (!me) return;
    var done = (me.tasksDone||[]).slice();
    if (done.indexOf(roomId) === -1) done.push(roomId);
    playersRef.child(myId).update({ tasksDone: done }).then(checkTaskWin);
  }
  function checkTaskWin(){
    if (!gameState || gameState.phase!=='playing') return;
    var impostorIds = computeImpostorIds(gameState.order, gameState.seed, gameState.impostorCount);
    var crew = players.filter(function(p){ return impostorIds.indexOf(p.id)<0; });
    var total=0, done=0;
    crew.forEach(function(p){ total += (p.tasksAssigned||[]).length; done += (p.tasksDone||[]).length; });
    if (total>0 && done>=total){
      stateRef.update({ phase:'ended', winner:'crew' });
    }
  }

  function tryKill(targetId){
    var me = findPlayer(myId);
    if (!me) return;
    var target = findPlayer(targetId);
    if (!target || target.alive===false) return;
    playersRef.child(targetId).update({ alive:false, deathX:target.x, deathY:target.y, bodyReported:false });
    playersRef.child(myId).update({ lastKillAt: Date.now() });
    setTimeout(checkImpostorWin, 300);
  }
  function checkImpostorWin(){
    if (!gameState || (gameState.phase!=='playing' && gameState.phase!=='meeting')) return;
    var impostorIds = computeImpostorIds(gameState.order, gameState.seed, gameState.impostorCount);
    var alive = alivePlayers();
    var impAlive = alive.filter(function(p){ return impostorIds.indexOf(p.id)>=0; }).length;
    var crewAlive = alive.length - impAlive;
    if (impAlive===0){ stateRef.update({ phase:'ended', winner:'crew' }); }
    else if (impAlive>=crewAlive){ stateRef.update({ phase:'ended', winner:'impostor' }); }
  }

  function callMeeting(reason, bodyOwnerId){
    var ends = new Date(Date.now() + (gameState.discussionSeconds||60)*1000).toISOString();
    var resets = alivePlayers().map(function(p){ return playersRef.child(p.id).update({ voteFor:null }); });
    if (reason==='emergency'){
      resets.push(playersRef.child(myId).update({ meetingsUsed: (findPlayer(myId).meetingsUsed||0)+1 }));
    }
    if (reason==='report' && bodyOwnerId){
      resets.push(playersRef.child(bodyOwnerId).update({ bodyReported:true }));
    }
    return Promise.all(resets).then(function(){
      return stateRef.update({ phase:'meeting', meetingCallerId:myId, meetingReason:reason, discussionEndsAt:ends });
    });
  }
  function castVote(targetId){ return playersRef.child(myId).update({ voteFor: targetId }); }

  function revealMeetingResults(){
    var alive = alivePlayers();
    var tally = {};
    alive.forEach(function(p){ if (p.voteFor) tally[p.voteFor]=(tally[p.voteFor]||0)+1; });
    var maxV=0, top=[];
    Object.keys(tally).forEach(function(id){ if (tally[id]>maxV){ maxV=tally[id]; top=[id]; } else if (tally[id]===maxV){ top.push(id); } });
    var impostorIds = computeImpostorIds(gameState.order, gameState.seed, gameState.impostorCount);
    var eliminatedId=null, eliminatedRole=null;
    var chain = Promise.resolve();
    if (top.length===1 && maxV>0){
      eliminatedId = top[0];
      eliminatedRole = impostorIds.indexOf(eliminatedId)>=0 ? 'impostor':'crew';
      chain = playersRef.child(eliminatedId).update({ alive:false });
    }
    return chain.then(function(){
      var aliveAfter = players.map(function(p){ return { id:p.id, alive: p.id===eliminatedId? false : (p.alive!==false) }; }).filter(function(p){ return p.alive; });
      var impAlive = aliveAfter.filter(function(p){ return impostorIds.indexOf(p.id)>=0; }).length;
      var crewAlive = aliveAfter.length - impAlive;
      var winner=null;
      if (impAlive===0) winner='crew'; else if (impAlive>=crewAlive) winner='impostor';
      return stateRef.update({ phase: winner?'ended':'meetingResults', lastEliminatedId:eliminatedId, lastEliminatedRole:eliminatedRole, winner:winner });
    });
  }
  function continueAfterMeeting(){ return stateRef.update({ phase:'playing', meetingCallerId:null, meetingReason:null }); }
  function playAgain(){ return startGame(); }
  function backToLobby(){ return stateRef.update({ phase:'lobby' }); }

  // ============================================================
  // RENDER DISPATCH
  // ============================================================
  function render(){
    if (connError){
      if (mountedPhase==='playing') GameView.unmount();
      mountedPhase=null; app.className='narrow'; clear(app);
      var msgs = { 'needs-setup':'Falta configurar Firebase en este archivo.', 'init-failed':'No se pudo inicializar Firebase.', 'auth-failed':'No se pudo iniciar sesión anónima. Revisa que esté activada en Firebase.', 'db-error':'No se pudo conectar con la base de datos. Revisa las reglas de Realtime Database.' };
      app.appendChild(renderMessage(msgs[connError] || 'Ocurrió un error de conexión.'));
      return;
    }
    if (myId===null || gameState===undefined){
      if (mountedPhase==='playing') GameView.unmount();
      mountedPhase=null; app.className='narrow'; clear(app); app.appendChild(renderLoading()); return;
    }
    if (!myName){
      if (mountedPhase==='playing') GameView.unmount();
      mountedPhase=null; app.className='narrow'; clear(app); app.appendChild(renderNameEntry()); return;
    }

    var phase = gameState ? gameState.phase : 'lobby';

    if (phase === 'playing'){
      app.className='';
      if (mountedPhase !== 'playing'){ clear(app); GameView.mount(); mountedPhase='playing'; }
      GameView.refreshHud();
      return;
    }
    if (mountedPhase === 'playing') GameView.unmount();
    mountedPhase = phase;
    app.className='narrow';
    clear(app);

    var me = findPlayer(myId);
    if (!gameState || phase==='lobby'){
      if (!me){ joinLobby(); app.appendChild(renderLoading()); return; }
      app.appendChild(renderTopbar(phase));
      app.appendChild(renderLobby());
      return;
    }
    app.appendChild(renderTopbar(phase));
    if (!me){
      var msg = renderMessage('No estás en esta partida. Espera a la siguiente ronda para unirte.');
      app.appendChild(msg); return;
    }
    switch(phase){
      case 'reveal': app.appendChild(renderReveal(me)); break;
      case 'meeting': app.appendChild(renderMeeting(me)); break;
      case 'meetingResults': app.appendChild(renderMeetingResults()); break;
      case 'ended': app.appendChild(renderEnded()); break;
      default: app.appendChild(renderLobby());
    }
  }

  // ============================================================
  // GAME VIEW (map, movement, tasks, kill, report)
  // ============================================================
  var GameView = (function(){
    var canvas, ctx, holder, joyBase, joyKnob, taskBtn, killBtn, reportBtn, meetBtn, taskPanel, hudProgress;
    var rafId = null, lastTs = null;
    var joy = { active:false, id:null, baseX:0, baseY:0, vx:0, vy:0 };
    var localX = SPAWN.x, localY = SPAWN.y, posInit = false;
    var lastSentAt = 0;
    var activeMinigame = null;

    function mount(){
      var wrap = el('div','gamewrap');
      var hud = el('div','hud-top');
      hudProgress = el('div','tasks-progress','Tareas 0/0');
      hud.appendChild(hudProgress);
      var meetingsLeftEl = el('div','muted','');
      hud.appendChild(meetingsLeftEl);
      wrap.appendChild(hud);

      holder = el('div','canvas-holder');
      canvas = document.createElement('canvas');
      canvas.id = 'mapCanvas';
      holder.appendChild(canvas);

      taskPanel = el('div','task-panel');
      holder.appendChild(taskPanel);

      joyBase = el('div','joy-base');
      joyKnob = el('div','joy-knob');
      joyBase.appendChild(joyKnob);
      holder.appendChild(joyBase);

      var actions = el('div','hud-actions');
      taskBtn = el('button','action-btn task','Hacer tarea'); taskBtn.style.display='none';
      killBtn = el('button','action-btn kill','Eliminar'); killBtn.style.display='none';
      reportBtn = el('button','action-btn report','Reportar cuerpo'); reportBtn.style.display='none';
      meetBtn = el('button','action-btn meeting','Reunión');
      actions.appendChild(taskBtn); actions.appendChild(killBtn); actions.appendChild(reportBtn); actions.appendChild(meetBtn);
      holder.appendChild(actions);

      wrap.appendChild(holder);
      app.appendChild(wrap);

      taskBtn.onclick = function(){ if (taskBtn.__roomId) openMinigame(taskBtn.__roomId); };
      killBtn.onclick = function(){ if (killBtn.__targetId) tryKill(killBtn.__targetId); };
      reportBtn.onclick = function(){ if (reportBtn.__ownerId) callMeeting('report', reportBtn.__ownerId); };
      meetBtn.onclick = function(){
        var me = findPlayer(myId);
        if (me && (me.meetingsUsed||0) < 1) callMeeting('emergency', null);
      };

      joyBase.addEventListener('pointerdown', onJoyDown);
      window.addEventListener('pointermove', onJoyMove);
      window.addEventListener('pointerup', onJoyUp);
      window.addEventListener('pointercancel', onJoyUp);
      window.addEventListener('resize', resizeCanvas);

      var me = findPlayer(myId);
      if (me){ localX = me.x||SPAWN.x; localY = me.y||SPAWN.y; }
      posInit = true;
      resizeCanvas();
      ctx = canvas.getContext('2d');
      lastTs = null;
      rafId = requestAnimationFrame(loop);
    }

    function unmount(){
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      window.removeEventListener('pointermove', onJoyMove);
      window.removeEventListener('pointerup', onJoyUp);
      window.removeEventListener('pointercancel', onJoyUp);
      window.removeEventListener('resize', resizeCanvas);
      closeMinigame();
      posInit = false;
    }

    function resizeCanvas(){
      if (!canvas || !holder) return;
      var w = holder.clientWidth, h = holder.clientHeight;
      canvas.width = w; canvas.height = h;
    }

    function onJoyDown(ev){
      if (joy.active) return;
      joy.active = true; joy.id = ev.pointerId;
      var r = joyBase.getBoundingClientRect();
      joy.baseX = r.left + r.width/2; joy.baseY = r.top + r.height/2;
      updateJoyFromPoint(ev.clientX, ev.clientY);
      ev.preventDefault();
    }
    function onJoyMove(ev){
      if (!joy.active || ev.pointerId !== joy.id) return;
      updateJoyFromPoint(ev.clientX, ev.clientY);
    }
    function onJoyUp(ev){
      if (!joy.active || ev.pointerId !== joy.id) return;
      joy.active=false; joy.vx=0; joy.vy=0;
      joyKnob.style.left='35px'; joyKnob.style.top='35px';
    }
    function updateJoyFromPoint(cx, cy){
      var dx = cx - joy.baseX, dy = cy - joy.baseY;
      var maxR = 40;
      var d = Math.hypot(dx,dy);
      if (d > maxR){ dx = dx/d*maxR; dy = dy/d*maxR; }
      joyKnob.style.left = (35+dx)+'px'; joyKnob.style.top = (35+dy)+'px';
      joy.vx = dx/maxR; joy.vy = dy/maxR;
    }

    function loop(ts){
      if (!lastTs) lastTs = ts;
      var dt = Math.min(0.05, (ts-lastTs)/1000);
      lastTs = ts;
      update(dt);
      draw();
      rafId = requestAnimationFrame(loop);
    }

    function update(dt){
      if (!gameState || gameState.phase!=='playing') return;
      var me = findPlayer(myId);
      if (!me || me.alive===false || activeMinigame) { return; }
      var vx = joy.vx, vy = joy.vy;
      if (Math.abs(vx)>0.05 || Math.abs(vy)>0.05){
        localX = clamp(localX + vx*SPEED*dt, 16, MAP_W-16);
        localY = clamp(localY + vy*SPEED*dt, 16, MAP_H-16);
        var now = Date.now();
        if (now - lastSentAt > 150){ lastSentAt = now; updateMyPosition(Math.round(localX), Math.round(localY)); }
      }
      refreshHud();
    }

    function scaleInfo(){
      var scale = Math.min(canvas.width/MAP_W, canvas.height/MAP_H);
      var offX = (canvas.width - MAP_W*scale)/2;
      var offY = (canvas.height - MAP_H*scale)/2;
      return { scale:scale, offX:offX, offY:offY };
    }
    function toScreen(x,y){ var s=scaleInfo(); return { x: s.offX + x*s.scale, y: s.offY + y*s.scale, scale:s.scale }; }

    function draw(){
      if (!ctx || !gameState) return;
      ctx.fillStyle = '#0c0d13';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      var s = scaleInfo();

      ROOMS.forEach(function(r){
        var p = toScreen(r.x, r.y);
        ctx.fillStyle = r.color;
        ctx.fillRect(p.x, p.y, r.w*s.scale, r.h*s.scale);
        ctx.strokeStyle = 'rgba(255,255,255,.18)';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, r.w*s.scale, r.h*s.scale);
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        ctx.font = (12*s.scale+6) + 'px Inter, sans-serif';
        ctx.fillText(r.name, p.x+8, p.y+18);

        var c = roomCenter(r); var cp = toScreen(c.x, c.y);
        var me = findPlayer(myId);
        var mine = me && (me.tasksAssigned||[]).indexOf(r.id) >= 0;
        var doneByMe = me && (me.tasksDone||[]).indexOf(r.id) >= 0;
        ctx.beginPath();
        ctx.arc(cp.x, cp.y, 9*s.scale, 0, Math.PI*2);
        ctx.fillStyle = mine ? (doneByMe ? '#4caf6a' : '#e8b23d') : 'rgba(255,255,255,.35)';
        ctx.fill();
      });

      // bodies
      players.forEach(function(p){
        if (p.alive===false && p.bodyReported===false && p.deathX!=null){
          var bp = toScreen(p.deathX, p.deathY);
          ctx.fillStyle = '#e8e2d0';
          ctx.font = (18*s.scale+8)+'px sans-serif';
          ctx.fillText('💀', bp.x-9*s.scale, bp.y+7*s.scale);
        }
      });

      // players
      players.forEach(function(p){
        if (p.alive===false) return;
        var px = (p.id===myId) ? localX : (p.x!=null?p.x:SPAWN.x);
        var py = (p.id===myId) ? localY : (p.y!=null?p.y:SPAWN.y);
        var sp = toScreen(px, py);
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, 12*s.scale, 0, Math.PI*2);
        ctx.fillStyle = p.color || '#b9791f';
        ctx.fill();
        if (p.id===myId){ ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke(); }
        ctx.fillStyle = '#fff';
        ctx.font = (11*s.scale+6)+'px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText((p.name||'?').slice(0,10), sp.x, sp.y - 16*s.scale);
        ctx.textAlign = 'left';
      });
    }

    function refreshHud(){
      if (!hudProgress) return;
      var impostorIds = gameState && gameState.order ? computeImpostorIds(gameState.order, gameState.seed, gameState.impostorCount) : [];
      var crew = players.filter(function(p){ return impostorIds.indexOf(p.id)<0; });
      var total=0, done=0;
      crew.forEach(function(p){ total += (p.tasksAssigned||[]).length; done += (p.tasksDone||[]).length; });
      hudProgress.textContent = 'Tareas '+done+'/'+total;

      var me = findPlayer(myId);
      var amImpostor = impostorIds.indexOf(myId)>=0;

      // task panel (mine only)
      clear(taskPanel);
      if (me && me.alive!==false){
        (me.tasksAssigned||[]).forEach(function(rid){
          var r = findRoom(rid);
          var doneIt = (me.tasksDone||[]).indexOf(rid)>=0;
          taskPanel.appendChild(el('div', doneIt?'done':'', (r?r.name:rid)));
        });
      }

      // nearest task
      taskBtn.style.display='none';
      if (me && me.alive!==false && !amImpostor){
        var nearestRoom=null, nearestD=1e9;
        (me.tasksAssigned||[]).forEach(function(rid){
          if ((me.tasksDone||[]).indexOf(rid)>=0) return;
          var r = findRoom(rid); var c = roomCenter(r);
          var d = dist(localX, localY, c.x, c.y);
          if (d<nearestD){ nearestD=d; nearestRoom=rid; }
        });
        if (nearestRoom && nearestD < TASK_RANGE){ taskBtn.style.display='inline-flex'; taskBtn.__roomId = nearestRoom; }
      } else if (me && me.alive!==false && amImpostor){
        // impostor: fake task button near any assigned room (auto-complete for cover)
        var nr=null, nd=1e9;
        (me.tasksAssigned||[]).forEach(function(rid){
          var r = findRoom(rid); var c = roomCenter(r); var d = dist(localX, localY, c.x, c.y);
          if (d<nd){ nd=d; nr=rid; }
        });
        if (nr && nd < TASK_RANGE){ taskBtn.style.display='inline-flex'; taskBtn.textContent='Fingir tarea'; taskBtn.__roomId = nr; taskBtn.__fake=true; }
        else { taskBtn.textContent='Hacer tarea'; }
      }

      // kill button
      killBtn.style.display='none';
      if (me && me.alive!==false && amImpostor){
        var cd = (Date.now() - (me.lastKillAt||0)) > KILL_COOLDOWN_MS;
        if (cd){
          var target=null, td=1e9;
          players.forEach(function(p){
            if (p.id===myId || p.alive===false) return;
            var d = dist(localX, localY, p.x!=null?p.x:SPAWN.x, p.y!=null?p.y:SPAWN.y);
            if (d<td){ td=d; target=p.id; }
          });
          if (target && td < KILL_RANGE){ killBtn.style.display='inline-flex'; killBtn.__targetId = target; }
        }
      }

      // report button
      reportBtn.style.display='none';
      if (me && me.alive!==false){
        var body=null, bd=1e9;
        players.forEach(function(p){
          if (p.alive===false && p.bodyReported===false && p.deathX!=null){
            var d = dist(localX, localY, p.deathX, p.deathY);
            if (d<bd){ bd=d; body=p.id; }
          }
        });
        if (body && bd < REPORT_RANGE){ reportBtn.style.display='inline-flex'; reportBtn.__ownerId = body; }
      }

      // meeting button
      if (me){ meetBtn.disabled = (me.meetingsUsed||0) >= 1 || me.alive===false; meetBtn.textContent = meetBtn.disabled ? 'Reunión usada' : 'Reunión'; }
    }

    // ---- Minigames ----
    function openMinigame(roomId){
      var room = findRoom(roomId);
      if (!room) return;
      var me = findPlayer(myId);
      var isFake = taskBtn.__fake;
      activeMinigame = { roomId:roomId };
      var overlay = el('div','modal');
      var card = el('div','modal-card');
      overlay.appendChild(card);
      document.body.appendChild(overlay);

      function finish(){
        document.body.removeChild(overlay);
        activeMinigame = null;
        if (!isFake) completeTask(roomId);
      }

      if (isFake){
        card.appendChild(el('h3','','Tarea simulada'));
        card.appendChild(el('p','muted','Finge estar ocupado un momento…'));
        var btn = el('button','btn btn-primary','Listo'); btn.style.marginTop='14px';
        btn.onclick = finish; card.appendChild(btn);
        return;
      }

      if (room.task === 'wire'){
        card.appendChild(el('h3','','Conecta los cables'));
        card.appendChild(el('p','muted','Toca un cable de la izquierda y su color en la derecha.'));
        var order = seededShuffle([0,1,2], Date.now());
        var leftSel = null;
        var matched = {};
        var rows = [];
        WIRE_COLORS.slice(0,3).forEach(function(color, i){
          var row = el('div','wire-row');
          var left = el('div','wire-dot'); left.style.background = color; left.dataset.i = i;
          var right = el('div','wire-dot'); var rc = WIRE_COLORS[order[i]]; right.style.background = rc; right.dataset.match = order[i];
          row.appendChild(left); row.appendChild(el('div','muted','—')); row.appendChild(right);
          card.appendChild(row);
          rows.push({left:left, right:right, i:i});
          left.onclick = function(){
            if (matched[i]) return;
            rows.forEach(function(r){ r.left.classList.remove('selected'); });
            left.classList.add('selected'); leftSel = i;
          };
          right.onclick = function(){
            if (leftSel===null) return;
            var rightMatch = parseInt(right.dataset.match,10);
            if (rightMatch === leftSel && !matched[leftSel]){
              matched[leftSel] = true;
              rows[leftSel].left.classList.add('locked');
              right.classList.add('locked');
              rows[leftSel].left.classList.remove('selected');
              leftSel = null;
              if (Object.keys(matched).length >= 3) setTimeout(finish, 300);
            } else {
              rows.forEach(function(r){ r.left.classList.remove('selected'); });
              leftSel = null;
            }
          };
        });
      } else {
        card.appendChild(el('h3','','Repite el patrón'));
        card.appendChild(el('p','muted','Memoriza la secuencia y tócala en el mismo orden.'));
        var grid = el('div','pattern-grid');
        var btns = PATTERN_COLORS.map(function(c){ var b=el('div','pattern-btn'); b.style.background=c; grid.appendChild(b); return b; });
        card.appendChild(grid);
        var seq = []; for (var i=0;i<4;i++) seq.push(Math.floor(Math.random()*4));
        var userIdx = 0;
        var playing = true;
        function playSeq(){
          playing = true; userIdx = 0;
          var i = 0;
          var iv = setInterval(function(){
            btns.forEach(function(b){ b.classList.remove('lit'); });
            if (i < seq.length){ btns[seq[i]].classList.add('lit'); i++; }
            else { clearInterval(iv); btns.forEach(function(b){ b.classList.remove('lit'); }); playing=false; }
          }, 550);
        }
        btns.forEach(function(b, idx){
          b.onclick = function(){
            if (playing) return;
            if (idx === seq[userIdx]){
              b.classList.add('lit'); setTimeout(function(){ b.classList.remove('lit'); }, 200);
              userIdx++;
              if (userIdx >= seq.length) setTimeout(finish, 300);
            } else {
              userIdx = 0; setTimeout(playSeq, 400);
            }
          };
        });
        setTimeout(playSeq, 400);
      }

      var skip = el('button','btn btn-secondary','Cancelar'); skip.style.marginTop='14px';
      skip.onclick = function(){ document.body.removeChild(overlay); activeMinigame=null; };
      card.appendChild(skip);
    }
    function closeMinigame(){
      var m = document.querySelector('.modal');
      if (m && m.parentNode) m.parentNode.removeChild(m);
      activeMinigame = null;
    }

    return { mount:mount, unmount:unmount, refreshHud:refreshHud };
  })();

  // ---------- Boot ----------
  (function boot(){
    if (!initFirebase()) return;
    initIdentity().then(function(){ if (connError) return; subscribe(); render(); });
  })();

})();
</script>
</body>
</html>
