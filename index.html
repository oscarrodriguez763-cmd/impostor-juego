<!--
  ============================================================
  CÓMO CONFIGURAR ESTE ARCHIVO (una sola vez)
  ============================================================
  1. Ve a https://console.firebase.google.com y crea un proyecto
     gratis (botón "Agregar proyecto").
  2. En el menú lateral: Compilación > Realtime Database >
     "Crear base de datos". Elige cualquier región. Empieza en
     "modo de prueba" (lo ajustamos con reglas más abajo).
  3. En el menú lateral: Compilación > Authentication >
     "Comenzar" > pestaña "Sign-in method" > activa "Anónimo".
  4. En el ícono de engranaje > "Configuración del proyecto" >
     baja hasta "Tus apps" > icono </> (Web) > regístrala con
     cualquier apodo. Copia el objeto firebaseConfig que te dan.
  5. Pega ese objeto reemplazando el de abajo (busca "PEGA AQUÍ").
  6. En Realtime Database > pestaña "Reglas", pega esto y publica:
     {
       "rules": {
         "games": {
           "default": {
             ".read": "auth != null",
             ".write": "auth != null"
           }
         }
       }
     }
  7. Sube este archivo .html a cualquier hosting (GitHub Pages,
     Netlify, Vercel, tu propio servidor) y comparte esa URL.
  ============================================================
-->

<style>
  :root{
    --bg:#f3efe4; --bg-elev:#ffffff; --card:#fbf8f0; --ink:#20201c; --ink-dim:#6b6558;
    --accent:#b9791f; --accent-ink:#fffaf0; --danger:#a13d33; --crew:#2b6a8a; --line:#ddd3bd;
    --shadow:0 1px 0 rgba(0,0,0,.06); --radius:16px;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14151d; --bg-elev:#1b1c27; --card:#20212e; --ink:#f1eee2; --ink-dim:#9b98ab;
      --accent:#e8b23d; --accent-ink:#1c1408; --danger:#e07a6f; --crew:#79c1e6; --line:#33344a;
      --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14151d; --bg-elev:#1b1c27; --card:#20212e; --ink:#f1eee2; --ink-dim:#9b98ab;
    --accent:#e8b23d; --accent-ink:#1c1408; --danger:#e07a6f; --crew:#79c1e6; --line:#33344a;
    --shadow:0 1px 0 rgba(0,0,0,.4); color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; padding-top:var(--safe-t); padding-bottom:var(--safe-b);
    min-height:100%; overscroll-behavior-y:none;
  }
  h1,h2,h3,.display{ font-family:'Special Elite','Inter',monospace; letter-spacing:.01em; }
  #app{ max-width:520px; margin:0 auto; padding:20px 18px 40px; }
  .topbar{ display:flex; align-items:baseline; justify-content:space-between; padding:6px 2px 18px; border-bottom:1px dashed var(--line); margin-bottom:18px; }
  .topbar h1{ font-size:1.5rem; margin:0; }
  .topbar .tag{ font-size:.72rem; color:var(--ink-dim); }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:var(--shadow); }
  .muted{ color:var(--ink-dim); }
  .center{ text-align:center; }
  p{ line-height:1.5; }
  input[type=text]{ width:100%; font-size:1rem; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg-elev); color:var(--ink); font-family:inherit; }
  input[type=text]:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  code{ background:var(--bg-elev); padding:2px 6px; border-radius:6px; }
  button{ font-family:'Inter',sans-serif; font-size:.98rem; cursor:pointer; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px 16px; border-radius:12px; border:1px solid transparent; font-weight:700; transition:transform .08s ease; }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-secondary{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .stepper{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 2px; }
  .stepper button{ width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--bg-elev); color:var(--ink); font-size:1.1rem; font-weight:700; }
  .stepper .val{ font-weight:700; min-width:70px; text-align:center; }
  .btn-row{ display:flex; gap:10px; width:auto; }
  .row{ display:flex; align-items:center; justify-content:space-between; margin:10px 0; }
  .players{ display:flex; flex-direction:column; gap:8px; }
  .player{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; background:var(--bg-elev); border:1px solid var(--line); }
  .player.dead{ opacity:.45; }
  .avatar{ width:38px; height:38px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.95rem; border:1px solid var(--line); color:var(--accent-ink); }
  .pname{ font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge{ font-size:.68rem; padding:3px 8px; border-radius:20px; border:1px solid var(--line); color:var(--ink-dim); }
  .badge.host{ color:var(--accent); border-color:var(--accent); }
  .reveal-card{ border-radius:20px; padding:36px 20px; text-align:center; cursor:pointer; background:var(--bg-elev); border:1px dashed var(--line); user-select:none; }
  .reveal-card .hint{ color:var(--ink-dim); font-size:.85rem; margin-top:10px; }
  .word-big{ font-family:'Special Elite',monospace; font-size:1.9rem; margin:6px 0; }
  .cat-label{ font-size:.8rem; letter-spacing:.03em; color:var(--ink-dim); }
  .impostor-flag{ color:var(--danger); }
  .timer{ font-family:'Special Elite',monospace; font-size:3rem; text-align:center; margin:8px 0; }
  .vote-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .vote-tile{ border-radius:14px; padding:14px 10px; text-align:center; background:var(--bg-elev); border:2px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:6px; }
  .vote-tile.selected{ border-color:var(--accent); }
  .vote-tile .avatar{ width:44px; height:44px; }
  .vote-tile .vname{ font-weight:600; font-size:.92rem; word-break:break-word; }
  .footer-note{ text-align:center; color:var(--ink-dim); font-size:.76rem; margin-top:16px; line-height:1.5; }
  .empty{ text-align:center; padding:30px 10px; color:var(--ink-dim); }
  .spin{ width:26px; height:26px; border-radius:50%; border:3px solid var(--line); border-top-color:var(--accent); animation:spin 1s linear infinite; margin:0 auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .btn{ transition:none; } .spin{ animation:none; } }
</style>

<body>
<div id="app"><div class="empty"><div class="spin"></div><p>Preparando la partida…</p></div></div>

<script>
(function(){
  "use strict";

  // ============================================================
  // PEGA AQUÍ tu configuración de Firebase (paso 5 de la guía de arriba)
  // ============================================================
  var firebaseConfig = {
    apiKey: "AIzaSyDPcCaTSJKix9JHmWWWlCGrBdrAePPSJCk",
    authDomain: "impostor-45469.firebaseapp.com",
    databaseURL: "https://impostor-45469-default-rtdb.firebaseio.com",
    projectId: "impostor-45469",
    storageBucket: "impostor-45469.firebasestorage.app",
    messagingSenderId: "305666372514",
    appId: "1:305666372514:web:ef48c426b903ff83b2f8fb"
  };
  // ============================================================

  var NEEDS_SETUP = (firebaseConfig.apiKey === "TU_API_KEY");

  // ---------- Word bank ----------
  var CATEGORIES = [
    { name:"Comida", words:["Pizza","Sushi","Tacos","Paella","Hamburguesa","Helado","Chocolate","Ensalada","Pasta","Empanada"] },
    { name:"Animales", words:["León","Elefante","Delfín","Águila","Tortuga","Pingüino","Jirafa","Canguro","Búho","Zorro"] },
    { name:"Profesiones", words:["Bombero","Médico","Panadero","Piloto","Profesor","Peluquero","Astronauta","Detective","Chef","Fotógrafo"] },
    { name:"Lugares", words:["Playa","Biblioteca","Aeropuerto","Montaña","Mercado","Museo","Estadio","Desierto","Hospital","Cine"] },
    { name:"Deportes", words:["Fútbol","Natación","Tenis","Ciclismo","Boxeo","Surf","Escalada","Voleibol","Atletismo","Ajedrez"] },
    { name:"Objetos cotidianos", words:["Paraguas","Espejo","Reloj","Mochila","Bicicleta","Linterna","Tijeras","Cámara","Guitarra","Maleta"] },
    { name:"Vacaciones", words:["Crucero","Camping","Safari","Esquí","Mochilero","Todo incluido","Cabaña","Roadtrip","Isla desierta","Parque temático"] },
    { name:"Emociones", words:["Alegría","Nostalgia","Sorpresa","Vergüenza","Orgullo","Envidia","Calma","Euforia","Miedo","Ternura"] }
  ];

  var AVATAR_PALETTE = ["#b9791f","#2b6a8a","#a13d33","#4c7a3d","#7a4c9d","#c26b2f","#2f6e6e","#8a5a2b"];

  // ---------- PRNG (deterministic per-round, computed locally by each device) ----------
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function seededShuffle(arr, seed){
    var rnd = mulberry32(seed), a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(rnd() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }
  function computeImpostorIds(order, seed, count){
    return seededShuffle(order, seed).slice(0, Math.max(1, Math.min(count, order.length - 1)));
  }
  function colorForId(id){
    var h = 0;
    for (var i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) >>> 0; }
    return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
  }

  // ---------- App state ----------
  var fbApp = null, rtdb = null, auth = null;
  var stateRef = null, playersRef = null;
  var myId = null, myName = "", myColor = "#b9791f";
  var gameState = undefined; // undefined = not loaded yet, null = doc doesn't exist
  var players = [];
  var localRevealed = false, localRevealRound = null;
  var timerInterval = null;
  var connError = null;

  var app = document.getElementById('app');

  function fmtInitial(name){ return (name || "?").trim().charAt(0).toUpperCase() || "?"; }
  function avatarEl(p){
    var d = document.createElement('div');
    d.className = 'avatar';
    d.style.background = p.color || '#b9791f';
    d.textContent = fmtInitial(p.name);
    return d;
  }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function clear(node){ while (node.firstChild) node.removeChild(node.firstChild); }
  function isHost(){ return gameState && gameState.hostId === myId; }
  function alivePlayers(){ return players.filter(function(p){ return p.alive !== false; }); }
  function findPlayer(id){ for (var i=0;i<players.length;i++) if (players[i].id===id) return players[i]; return null; }

  function loadGuestName(){ try { return localStorage.getItem('impostor_guest_name') || ''; } catch(e){ return ''; } }
  function saveGuestName(name){ try { localStorage.setItem('impostor_guest_name', name); } catch(e){} }

  // ---------- Firebase init ----------
  function initFirebase(){
    if (NEEDS_SETUP) { connError = 'needs-setup'; render(); return false; }
    try {
      fbApp = firebase.initializeApp(firebaseConfig);
      rtdb = firebase.database();
      auth = firebase.auth();
    } catch(e){ connError = 'init-failed'; render(); return false; }
    stateRef = rtdb.ref('games/default/state');
    playersRef = rtdb.ref('games/default/players');
    return true;
  }

  function initIdentity(){
    return new Promise(function(resolve){
      auth.onAuthStateChanged(function(user){
        if (user){
          myId = user.uid;
          myColor = colorForId(myId);
          myName = loadGuestName();
          resolve();
        } else {
          auth.signInAnonymously().catch(function(e){
            connError = 'auth-failed'; render(); resolve();
          });
        }
      });
    });
  }

  function subscribe(){
    stateRef.on('value', function(snap){
      gameState = snap.exists() ? snap.val() : null;
      render();
    }, function(err){ connError = 'db-error'; render(); });

    playersRef.on('value', function(snap){
      var val = snap.val() || {};
      players = Object.keys(val).map(function(id){ var d = val[id]; d.id = id; return d; });
      render();
    }, function(err){ connError = 'db-error'; render(); });
  }

  // ---------- Actions ----------
  function ensureGameDocExists(){
    return stateRef.once('value').then(function(snap){
      if (!snap.exists()){
        return stateRef.set({ phase:'lobby', hostId: myId, createdAt: new Date().toISOString() }).catch(function(){});
      }
    });
  }

  function joinLobby(){
    var data = { name: myName || 'Jugador', color: myColor, joinedAt: new Date().toISOString(), alive:true, voteFor:null, ready:false };
    return playersRef.child(myId).set(data).then(ensureGameDocExists);
  }
  function leaveLobby(){ return playersRef.child(myId).remove().catch(function(){}); }
  function becomeHost(){ return stateRef.update({ hostId: myId }).catch(function(){}); }

  function impostorSuggestion(n){ return Math.max(1, Math.min(3, Math.floor(n/5) || 1)); }
  var pendingSettings = { impostorCount: null, discussionSeconds: 90 };

  function startGame(){
    var order = players.map(function(p){ return p.id; });
    if (order.length < 3) return;
    var seed = Math.floor(Math.random() * 1e9);
    var categoryIndex = Math.floor(Math.random() * CATEGORIES.length);
    var wordIndex = Math.floor(Math.random() * CATEGORIES[categoryIndex].words.length);
    var impostorCount = pendingSettings.impostorCount || impostorSuggestion(order.length);
    impostorCount = Math.max(1, Math.min(impostorCount, order.length - 2 > 0 ? order.length - 2 : 1));

    var resets = players.map(function(p){ return playersRef.child(p.id).update({ alive:true, voteFor:null, ready:false }); });
    return Promise.all(resets).then(function(){
      return stateRef.update({
        phase:'reveal', seed:seed, order:order, impostorCount:impostorCount,
        categoryIndex:categoryIndex, wordIndex:wordIndex,
        discussionSeconds: pendingSettings.discussionSeconds || 90,
        discussionEndsAt:null, round:1, lastEliminatedId:null, lastEliminatedRole:null, winner:null,
        startedAt: new Date().toISOString()
      });
    });
  }

  function markReady(){ return playersRef.child(myId).update({ ready:true }); }
  function beginDiscussion(){
    var ends = new Date(Date.now() + (gameState.discussionSeconds || 90) * 1000).toISOString();
    return stateRef.update({ phase:'discussion', discussionEndsAt: ends });
  }
  function goToVoting(){ return stateRef.update({ phase:'voting' }); }
  function castVote(targetId){ return playersRef.child(myId).update({ voteFor: targetId }); }

  function revealResults(){
    var alive = alivePlayers();
    var tally = {};
    alive.forEach(function(p){ if (p.voteFor) tally[p.voteFor] = (tally[p.voteFor]||0) + 1; });
    var maxVotes = 0, top = [];
    Object.keys(tally).forEach(function(id){
      if (tally[id] > maxVotes){ maxVotes = tally[id]; top = [id]; }
      else if (tally[id] === maxVotes){ top.push(id); }
    });

    var impostorIds = computeImpostorIds(gameState.order, gameState.seed, gameState.impostorCount);
    var eliminatedId = null, eliminatedRole = null;
    var chain = Promise.resolve();

    if (top.length === 1 && maxVotes > 0){
      eliminatedId = top[0];
      eliminatedRole = impostorIds.indexOf(eliminatedId) >= 0 ? 'impostor' : 'crew';
      chain = playersRef.child(eliminatedId).update({ alive:false });
    }

    return chain.then(function(){
      var aliveAfter = players.map(function(p){
        return { id:p.id, alive: p.id === eliminatedId ? false : (p.alive !== false) };
      }).filter(function(p){ return p.alive; });
      var impostorsAlive = aliveAfter.filter(function(p){ return impostorIds.indexOf(p.id) >= 0; }).length;
      var crewAlive = aliveAfter.length - impostorsAlive;
      var winner = null;
      if (impostorsAlive === 0) winner = 'crew';
      else if (impostorsAlive >= crewAlive) winner = 'impostor';

      return stateRef.update({
        phase: winner ? 'ended' : 'results',
        lastEliminatedId: eliminatedId, lastEliminatedRole: eliminatedRole, winner: winner
      });
    });
  }

  function nextRound(){
    var alive = alivePlayers();
    var resets = alive.map(function(p){ return playersRef.child(p.id).update({ voteFor:null }); });
    return Promise.all(resets).then(function(){
      var ends = new Date(Date.now() + (gameState.discussionSeconds || 90) * 1000).toISOString();
      return stateRef.update({ phase:'discussion', discussionEndsAt: ends, round: (gameState.round||1) + 1 });
    });
  }
  function playAgain(){ return startGame(); }
  function backToLobby(){ return stateRef.update({ phase:'lobby' }); }

  // ---------- Rendering ----------
  function render(){
    clear(app);

    if (connError === 'needs-setup'){ app.appendChild(renderSetupNeeded()); return; }
    if (connError === 'auth-failed' || connError === 'init-failed' || connError === 'db-error'){
      app.appendChild(renderMessage('No se pudo conectar con Firebase. Revisa la configuración y las reglas de la base de datos (ver comentario al inicio del archivo).'));
      return;
    }
    if (myId === null || gameState === undefined){ app.appendChild(renderLoading()); return; }
    if (!myName){ app.appendChild(renderNameEntry()); return; }

    var me = findPlayer(myId);
    var phase = gameState ? gameState.phase : 'lobby';
    app.appendChild(renderTopbar(phase));

    if (!gameState || phase === 'lobby'){
      if (!me){ joinLobby(); app.appendChild(renderLoading()); return; }
      app.appendChild(renderLobby());
      return;
    }
    if (!me){
      var msg = renderMessage('No estás en esta partida. Únete cuando empiece la siguiente ronda.');
      var btn = el('button','btn btn-secondary','Unirme ahora');
      btn.onclick = joinLobby;
      msg.appendChild(btn);
      app.appendChild(msg);
      return;
    }
    switch(phase){
      case 'reveal': app.appendChild(renderReveal(me)); break;
      case 'discussion': app.appendChild(renderDiscussion(me)); break;
      case 'voting': app.appendChild(renderVoting(me)); break;
      case 'results': app.appendChild(renderResults(me)); break;
      case 'ended': app.appendChild(renderEnded(me)); break;
      default: app.appendChild(renderLobby());
    }
  }

  function renderSetupNeeded(){
    var card = el('div','card');
    card.appendChild(el('h2','','Falta configurar Firebase'));
    card.appendChild(el('p','muted','Abre este archivo .html en un editor de texto y sigue los 7 pasos del comentario al principio del código: crea un proyecto en Firebase, activa Realtime Database y el inicio de sesión anónimo, y pega tu configuración donde dice "PEGA AQUÍ".'));
    return card;
  }
  function renderLoading(){
    var d = el('div','empty'); d.appendChild(el('div','spin')); d.appendChild(el('p','','Conectando…')); return d;
  }
  function renderMessage(text){ var d = el('div','card center'); d.appendChild(el('p','', text)); return d; }

  function renderTopbar(phase){
    var bar = el('div','topbar');
    bar.appendChild(el('h1','','IMPOSTOR'));
    var tagText = { lobby:'Sala de espera', reveal:'Repartiendo roles', discussion:'Debate', voting:'Votación', results:'Resultado', ended:'Fin de la partida' }[phase] || 'Sala de espera';
    bar.appendChild(el('div','tag', tagText));
    return bar;
  }

  function renderNameEntry(){
    var wrap = el('div','');
    var card = el('div','card');
    card.appendChild(el('h2','','¿Cómo te llamas?'));
    card.appendChild(el('p','muted','Este nombre lo verán el resto de jugadores en la partida.'));
    var input = document.createElement('input');
    input.type='text'; input.placeholder='Tu nombre'; input.maxLength=24; input.style.marginBottom='12px';
    card.appendChild(input);
    var btn = el('button','btn btn-primary','Continuar');
    btn.onclick = function(){ var v=input.value.trim(); if(!v){input.focus();return;} myName=v; saveGuestName(v); render(); };
    input.addEventListener('keydown', function(ev){ if(ev.key==='Enter') btn.click(); });
    card.appendChild(btn);
    wrap.appendChild(card);
    setTimeout(function(){ input.focus(); }, 50);
    return wrap;
  }

  function renderLobby(){
    var frag = document.createDocumentFragment();
    var info = el('div','card');
    info.appendChild(el('p','muted','Compartan esta misma página para jugar juntos. Cuando todos hayan entrado, el anfitrión puede empezar la partida.'));
    frag.appendChild(info);

    var listCard = el('div','card');
    var head = el('div','row');
    head.appendChild(el('h3','','Jugadores'));
    head.appendChild(el('span','muted', players.length + (players.length===1?' persona':' personas')));
    listCard.appendChild(head);
    var list = el('div','players');
    players.forEach(function(p){
      var row = el('div','player');
      row.appendChild(avatarEl(p));
      row.appendChild(el('span','pname', p.name || 'Jugador'));
      if (gameState && gameState.hostId === p.id) row.appendChild(el('span','badge host','Anfitrión'));
      list.appendChild(row);
    });
    if (!players.length) list.appendChild(el('p','muted','Todavía no hay nadie.'));
    listCard.appendChild(list);
    frag.appendChild(listCard);

    var hostGone = gameState && gameState.hostId && !findPlayer(gameState.hostId);
    if (hostGone){
      var claim = el('div','card center');
      claim.appendChild(el('p','muted','El anfitrión anterior ya no está. Alguien puede tomar el mando.'));
      var cbtn = el('button','btn btn-secondary','Ser anfitrión'); cbtn.onclick = becomeHost;
      claim.appendChild(cbtn); frag.appendChild(claim);
    }

    if (isHost() || !gameState || (gameState && !gameState.hostId)){
      var setup = el('div','card'); setup.appendChild(el('h3','','Ajustes'));
      var impN = pendingSettings.impostorCount || impostorSuggestion(players.length);
      pendingSettings.impostorCount = impN;
      var s1 = el('div','stepper'); s1.appendChild(el('span','','Impostores'));
      var minus1=el('button','','−'), plus1=el('button','','+'), val1=el('span','val',String(impN));
      minus1.onclick=function(){ pendingSettings.impostorCount=Math.max(1,(pendingSettings.impostorCount||impN)-1); render(); };
      plus1.onclick=function(){ var maxA=Math.max(1,players.length-2); pendingSettings.impostorCount=Math.min(maxA,(pendingSettings.impostorCount||impN)+1); render(); };
      var s1r=el('div','btn-row'); s1r.appendChild(minus1); s1r.appendChild(val1); s1r.appendChild(plus1); s1.appendChild(s1r);
      setup.appendChild(s1);

      var secs = pendingSettings.discussionSeconds || 90;
      var s2 = el('div','stepper'); s2.appendChild(el('span','','Tiempo de debate'));
      var steps=[45,60,90,120,180,240];
      var minus2=el('button','','−'), plus2=el('button','','+'), val2=el('span','val', secs+'s');
      minus2.onclick=function(){ var i=steps.indexOf(pendingSettings.discussionSeconds||90); pendingSettings.discussionSeconds=steps[Math.max(0,i-1)]; render(); };
      plus2.onclick=function(){ var i=steps.indexOf(pendingSettings.discussionSeconds||90); pendingSettings.discussionSeconds=steps[Math.min(steps.length-1,i+1)]; render(); };
      var s2r=el('div','btn-row'); s2r.appendChild(minus2); s2r.appendChild(val2); s2r.appendChild(plus2); s2.appendChild(s2r);
      setup.appendChild(s2);
      frag.appendChild(setup);

      var startBtn = el('button','btn btn-primary', players.length<3 ? 'Necesitas al menos 3 jugadores' : 'Comenzar partida');
      startBtn.disabled = players.length<3; startBtn.onclick = startGame;
      frag.appendChild(startBtn);
      if (players.length>0 && players.length<7) frag.appendChild(el('p','footer-note','Funciona con 3 o más, pero es más divertido con 7 o más jugadores.'));
    } else {
      frag.appendChild(el('p','footer-note','Esperando a que el anfitrión comience la partida…'));
    }

    var leave = el('button','btn btn-secondary','Salir de la partida');
    leave.style.marginTop='6px'; leave.onclick = leaveLobby;
    frag.appendChild(leave);
    return frag;
  }

  function renderReveal(me){
    if (localRevealRound !== gameState.round){ localRevealed = false; localRevealRound = gameState.round; }
    var frag = document.createDocumentFragment();
    var impostorIds = computeImpostorIds(gameState.order, gameState.seed, gameState.impostorCount);
    var amImpostor = impostorIds.indexOf(myId) >= 0;
    var cat = CATEGORIES[gameState.categoryIndex];
    var word = cat.words[gameState.wordIndex];

    var card = el('div','reveal-card');
    if (!localRevealed){
      card.appendChild(el('div','display','🎭'));
      card.appendChild(el('h2','','Toca para ver tu rol'));
      card.appendChild(el('p','hint','Nadie más debe ver tu pantalla.'));
      card.onclick = function(){ localRevealed = true; markReady(); render(); };
    } else if (amImpostor){
      card.appendChild(el('div','cat-label', 'Categoría: ' + cat.name));
      card.appendChild(el('div','word-big impostor-flag', 'ERES EL IMPOSTOR'));
      card.appendChild(el('p','hint','No conoces la palabra secreta. Escucha con atención y disimula.'));
    } else {
      card.appendChild(el('div','cat-label', cat.name));
      card.appendChild(el('div','word-big', word));
      card.appendChild(el('p','hint','Describe esta palabra sin decirla. Hay al menos un impostor entre ustedes.'));
    }
    frag.appendChild(card);

    var readyCount = players.filter(function(p){ return p.ready; }).length;
    var status = el('div','card center');
    status.appendChild(el('p','muted', readyCount + ' de ' + players.length + ' ya vieron su rol'));
    frag.appendChild(status);

    if (isHost()){
      var goBtn = el('button','btn btn-primary','Empezar debate'); goBtn.onclick = beginDiscussion; frag.appendChild(goBtn);
    } else {
      frag.appendChild(el('p','footer-note','Esperando a que el anfitrión empiece el debate…'));
    }
    return frag;
  }

  function renderDiscussion(me){
    var frag = document.createDocumentFragment();
    var timerCard = el('div','card center');
    var timerEl = el('div','timer','--:--');
    timerCard.appendChild(el('p','muted','Discutan en voz alta quién les parece sospechoso.'));
    timerCard.appendChild(timerEl); frag.appendChild(timerCard);

    if (timerInterval) clearInterval(timerInterval);
    function tick(){
      if (!gameState.discussionEndsAt){ timerEl.textContent='--:--'; return; }
      var remaining = Math.max(0, Math.floor((new Date(gameState.discussionEndsAt).getTime()-Date.now())/1000));
      var m=Math.floor(remaining/60), s=remaining%60;
      timerEl.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    }
    tick(); timerInterval = setInterval(tick, 500);

    if (isHost()){
      var voteBtn = el('button','btn btn-primary','Pasar a votación'); voteBtn.onclick = goToVoting; frag.appendChild(voteBtn);
    } else {
      frag.appendChild(el('p','footer-note','El anfitrión pasará a la votación cuando termine el tiempo.'));
    }
    return frag;
  }

  function renderVoting(me){
    var frag = document.createDocumentFragment();
    frag.appendChild(el('p','muted','¿A quién crees que es el impostor?'));
    var grid = el('div','vote-grid');
    var alive = alivePlayers();
    var myPlayer = findPlayer(myId);
    var canVote = myPlayer && myPlayer.alive !== false;
    alive.forEach(function(p){
      var tile = el('div','vote-tile' + (myPlayer && myPlayer.voteFor===p.id ? ' selected':''));
      tile.appendChild(avatarEl(p));
      tile.appendChild(el('div','vname', p.id===myId ? (p.name||'Tú')+' (tú)' : (p.name||'Jugador')));
      if (canVote && p.id!==myId){ tile.onclick = function(){ castVote(p.id); }; } else { tile.style.opacity='.55'; }
      grid.appendChild(tile);
    });
    frag.appendChild(grid);
    if (!canVote) frag.appendChild(el('p','footer-note','Ya fuiste eliminado — solo puedes observar.'));
    var votedCount = alive.filter(function(p){ return !!p.voteFor; }).length;
    frag.appendChild(el('p','footer-note', votedCount + ' de ' + alive.length + ' votaron'));
    if (isHost()){
      var reveal = el('button','btn btn-primary','Revelar resultado'); reveal.onclick = revealResults; frag.appendChild(reveal);
    }
    return frag;
  }

  function renderResults(me){
    var frag = document.createDocumentFragment();
    var card = el('div','card center');
    if (gameState.lastEliminatedId){
      var elim = findPlayer(gameState.lastEliminatedId);
      var name = elim ? (elim.name||'Alguien') : 'Alguien';
      card.appendChild(el('h2','', name + ' fue eliminado'));
      var roleText = gameState.lastEliminatedRole==='impostor' ? 'Era el IMPOSTOR' : 'Era parte del grupo (no era impostor)';
      card.appendChild(el('p', gameState.lastEliminatedRole==='impostor'?'word-big impostor-flag':'word-big', roleText));
    } else {
      card.appendChild(el('h2','','Empate — nadie fue eliminado'));
    }
    frag.appendChild(card);
    if (isHost()){
      var next = el('button','btn btn-primary','Siguiente ronda'); next.onclick = nextRound; frag.appendChild(next);
    } else {
      frag.appendChild(el('p','footer-note','Esperando al anfitrión para continuar…'));
    }
    return frag;
  }

  function renderEnded(me){
    var frag = document.createDocumentFragment();
    var impostorIds = computeImpostorIds(gameState.order, gameState.seed, gameState.impostorCount);
    var card = el('div','card center');
    card.appendChild(el('h2','', gameState.winner==='crew' ? '¡Ganó el grupo!' : '¡Ganaron los impostores!'));
    var cat = CATEGORIES[gameState.categoryIndex];
    card.appendChild(el('p','muted','La palabra secreta era: ' + cat.words[gameState.wordIndex] + ' (' + cat.name + ')'));
    frag.appendChild(card);

    var listCard = el('div','card'); listCard.appendChild(el('h3','','Los impostores eran'));
    var list = el('div','players');
    impostorIds.forEach(function(id){
      var p = findPlayer(id);
      var row = el('div','player');
      row.appendChild(avatarEl(p || {name:'?', color:'#888'}));
      row.appendChild(el('span','pname', p ? (p.name||'Jugador') : 'Jugador'));
      list.appendChild(row);
    });
    listCard.appendChild(list); frag.appendChild(listCard);

    if (isHost()){
      var again = el('button','btn btn-primary','Jugar de nuevo'); again.onclick = playAgain; frag.appendChild(again);
      var lobby = el('button','btn btn-secondary','Volver a la sala'); lobby.style.marginTop='8px'; lobby.onclick = backToLobby;
      frag.appendChild(lobby);
    } else {
      frag.appendChild(el('p','footer-note','Esperando al anfitrión…'));
    }
    return frag;
  }

  // ---------- Boot ----------
  (function boot(){
    if (!initFirebase()) return;
    initIdentity().then(function(){
      if (connError) return;
      subscribe();
      render();
    });
  })();

})();
</script>
</body>
</html>
